# JetPack 6 override (applied by `cam-up` for platform jp6 -- auto-detected on an R36 host, or --jp6).
#
# The r36 nvidia runtime injects the driver + multimedia + nv-plugin layer and the device nodes its
# CSVs list (drivers.csv, devices.csv) -- but ONLY into a container that asks: NVIDIA_VISIBLE_DEVICES
# must be set. NVIDIA's l4t-base sets it; a plain Ubuntu base does not, and `runtime: nvidia` is then
# plain runc (measured on an R36.4.4 Orin: no libraries, no /dev/v4l2-nvenc --
# docs/jp6-modern-userspace.md "Finding on JP6"). The images set it since 1d7faa8; this overlay
# repeats it for the two containers that encode, and grants the v4l2 codec nodes explicitly for a
# toolkit whose devices.csv lacks them.
#
# Not for the dev platform (a bench box has no such nodes: compose would refuse to create the
# container) and not for JP7, whose CDI spec carries everything.
services:
  core-driver:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev/v4l2-nvenc:/dev/v4l2-nvenc
      - /dev/v4l2-nvdec:/dev/v4l2-nvdec
  webrtc-bridge:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev/v4l2-nvenc:/dev/v4l2-nvenc
      - /dev/v4l2-nvdec:/dev/v4l2-nvdec
