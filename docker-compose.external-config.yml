# Overlay added by cam-up for EVERY sensor config (in-repo or external, e.g. a vehicle-level
# config inventory managed by `rig`): it bind-mounts the single config file at CAM_CONFIG -- an
# absolute in-container path deliberately OUTSIDE the image's /app tree -- and the core/supervisor
# loads it via that absolute path. One file bind is the whole config surface of the artifact:
# no directory binds into the repo (`rig certify` flags those -- bake would freeze the repo path).
#
# One file is enough because a sensor config is self-contained -- config.load_config() reads a
# single YAML and fills the rest from dataclass defaults (it does NOT merge camera.yaml). If
# sensor configs ever reference other external files, mount the parent dir here instead.
#
# cam-up sets CAM_CONFIG_HOST (abs host path) + CAM_CONFIG (=/run/cam-sensor.yaml for externals).
services:
  core-driver:
    volumes:
      - ${CAM_CONFIG_HOST}:${CAM_CONFIG}:ro
