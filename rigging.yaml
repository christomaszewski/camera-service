# Descriptor for the "rig" vehicle-level orchestrator: how to invoke this service's per-sensor
# launcher. Descriptive metadata ONLY -- this repo does not depend on rig, and rig depends on
# this repo (one-way). rig invokes:  <launcher> <config> <mapped-verb>   e.g.  cam-up <config> up -d
service: camera-service
launcher: cam-up
verbs:
  up: "up -d"
  down: "down"
  status: "ps"       # rig may append `--format json` to parse `docker compose ps`
  logs: "logs"
  config: "config"
ros_distro: lyrical
tier: sensor                             # rig bring-up tier (infra -> sensors -> autonomy, reversed on the
#                                          way down). `sensor` is also rig's default for an undeclared
#                                          service -- pinned explicitly so this stack's ordering semantics
#                                          never ride on that default (rig validates the value, so a typo
#                                          errors instead of silently demoting; vehicle.yaml can still
#                                          override per deployment via `rig add --tier`).

platform:                                # JP6 vs JP7 is a HOST fact; cam-up auto-detects it per host
  auto_detect: /etc/nv_tegra_release     #   R36 -> jp6 (l4t + nvidia runtime); R38+ -> jp7 (runc + CDI)
  override_env: CAM_PLATFORM            #   rig may set this per host to {jp6|jp7|dev} to pin instead of detect
  #                                        (cam-up also honors rig's standard RIG_TARGET_PLATFORM, from
  #                                         vehicle.yaml `platform:`; CAM_PLATFORM wins when both are set)
  #                                      `dev` is a NON-vehicle target: an arm64/x86 bench box with no
  #                                      Jetson (bench rig, CI, laptop). It selects cam-dev + runc +
  #                                      bridge net and mirrors JP6 userspace, so bench runs exercise
  #                                      the same shm+header transport a JP6 vehicle does. Never
  #                                      auto-detected -- a host must ask for it.

images:                                  # pull-based deploy: cam-up points images at a registry (docs/deploy-without-rig.md)
  registry_env: CAM_REGISTRY            #   set -> <registry>/<name>:<platform> for every image; then `pull` + `up`
  rig_registry_env: RIG_IMAGE_REGISTRY   #   rig's fleet registry; cam-up honors it (applies the platform tag)
  rig_tag_env: RIG_IMAGE_TAG             #   rig's fleet image tag (= vehicle.yaml images.tag). A VERSION tag
  #                                          (v1.4.0) pairs with the per-host platform: cam-up composes
  #                                          <version>-<platform> pull refs to match the published matrix.
  #                                          Legacy platform-valued tags (jp7) still work verbatim.
  tag_env: CAM_IMAGE_TAG                #   default tag = detected platform (jp6/jp7); set to pin a release
  per_image_env: [CAM_CORE_IMAGE, CAM_DEV_IMAGE, CAM_ROS2_IMAGE, CAM_ROS1_IMAGE, CAM_WEBRTC_IMAGE]  # override a single image
  #                                        (CAM_DEV_IMAGE is the core on the `dev` platform, where
  #                                         cam-dev replaces cam-core)

build:                                   # rig's BUILD phase: how to (re)build + push this stack's images to the
                                         # fleet registry. See docs/fleet-build-contract.md for the rig loop.
  command: tools/build-images.sh         #   builds + pushes; reads $RIG_IMAGE_REGISTRY (or arg $1); tag = arg $2
  arch: arm64                            #   build NATIVELY on an arm64 host (Aravis + colcon compiles; no qemu)
  platforms: [jp7, jp6, dev]             #   platform tags this stack publishes -- rig builds the ones the fleet uses
                                         #   (`dev` only gets built when a target actually declares it,
                                         #    so listing it here costs a normal fleet build nothing)
  images: [cam-core, cam-dev, ros2-bridge, ros1-bridge, webrtc-bridge]   # produced as <registry>/<image>:<platform>
                                         #   (ros1-bridge is Noetic / jp6-class; built into the jp6 set.
                                         #    cam-dev is the `dev` set's core, replacing cam-core there)

examples:                                # repo-relative example configs. [0] is special: `rig pkg add`
  #                                        seeds a bare (profile-less) instance's editable config from it,
  #                                        and `rig certify --repo` uses it as the default --config. It is
  #                                        NAMELESS (rig's instance row supplies `name`) and carries the
  #                                        full config surface with the alternatives commented. The rest
  #                                        ride along as reference material (real-hardware variants).
  - core-driver/config/sensors/camera.example.yaml
  - core-driver/config/sensors/cam_gige.yaml
  - core-driver/config/sensors/cam_usb.yaml
  - core-driver/config/sensors/cam_rtsp.yaml
  - core-driver/config/sensors/cam_thermal.yaml

launch_surface:                          # the files rig copies to the vehicle (NOT the source/build context)
  - cam-up
  - tools/sensor_env.py
  - docker-compose.yml
  - docker-compose.dev.yml
  - docker-compose.external-config.yml
  - docker-compose.jp7.yml                # the JP7 (runc + CDI NVENC) overlay; cam-up applies it per host
  - docker-compose.usb.yml                # USB v4l2 device overlay; cam-up applies it for a real usb source
  - docker-compose.input.yml              # playback input bind (pcap/replay); cam-up applies it for a
                                          #   playback source -- the capture/run lives on the host
  - plugins/ros2-bridge/compose.yml
  - plugins/ros1-bridge/compose.yml
  - plugins/webrtc-bridge/compose.yml

external_volumes:                        # rig removes these only on FINAL teardown (`rig down --purge`),
  - "cam_{name}_sock"                   #   never on a restart; {name} is the instance name

host_ports:                              # host-facing ports `rig doctor` checks for clashes across sensors
  #   (host networking -> a port is shared vehicle-wide). The enabled=true selector is enabled-aware, so a
  #   DISABLED webrtc-bridge is not flagged.
  - "plugins[name=webrtc-bridge,enabled=true].params.port"
