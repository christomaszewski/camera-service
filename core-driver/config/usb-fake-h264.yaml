# Opt-in lossy H.264 recording example with a fake USB camera.
#
# Exercises the usb Source through the SHARED pipeline (appsink -> on_frame -> appsrc -> tee ->
# recorder/transport), proving a second source type works end to end without real v4l2.
#
# Run:  docker run --rm -v "$PWD/core-driver:/app" cam-dev python3 main.py -c config/usb-fake-h264.yaml
camera:
  type: usb               # general block: `type` selects the source; frame_rate/reconnect are general
  frame_rate: 25.0

usb:
  fake: true                     # videotestsrc instead of v4l2src
  pixel_format: NV12
  width: 640
  height: 480

recording:
  enabled: true
  encoder: x264                 # software H.264; intentionally lossy, 8-bit 4:2:0
  x264_crf: 23                  # 1..50; lower = better quality/larger files
  x264_preset: ultrafast         # lower CPU; try veryfast for smaller files
  keyframe_interval_s: 1
  name_prefix: h264fake
  segment_seconds: 2

preview:
  enabled: false

transport:
  plugin_endpoint:
    enabled: true
    socket_path: /tmp/cam/frames
    max_rate_hz: 0
  raw_endpoint:
    enabled: false
    socket_path: /tmp/cam/raw

plugins: []
