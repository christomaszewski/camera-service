# Core config for the WebRTC round-trip test (no Jetson, no camera).
# Fake camera -> BOTH transport endpoints, so webrtc_test.sh can exercise the bridge on either:
#   plugin_endpoint -> shm+header (/tmp/cam/frames) on gst < 1.24   (the JP6 default path)
#   raw_endpoint    -> raw shm    (/tmp/cam/raw)                    (the legacy shm-raw path)
# Recording is off; this exercises only the transport->webrtc path.
camera:
  type: gige
  frame_rate: 25.0

gige:
  fake: true
  camera_id: Fake_1
  pixel_format: Mono8
  timestamp_source: ptp_chunk     # fake camera has no chunks -> falls back to camera/system (expected)
  ptp_enable: false

recording:
  enabled: false

preview:
  enabled: false

transport:
  plugin_endpoint:
    enabled: true
    socket_path: /tmp/cam/frames  # [36-byte CAMF header][pixels]; geometry/format self-describe
  raw_endpoint:
    enabled: true
    socket_path: /tmp/cam/raw     # legacy: headerless video/x-raw GRAY8 512x512@25 (env geometry)
