# Core config for the WebRTC COLOR round-trip test (Bayer camera; no Jetson, no camera).
# Fake BayerRG8 -> the plugin endpoint, which webrtc_test.sh exercises on either transport:
#   gst >= 1.24 core -> unixfd (/tmp/cam/unixfd)                 (the JP7 path)
#   gst <  1.24 core -> shm + 36-byte header (/tmp/cam/frames)   (the JP6 path)
# Both carry the raw mosaic (as GRAY8 on the header path -- CAM_BAYER relabels it in the bridge);
# the bridge debayers to color in-pipeline (bayer2rgb).
camera:
  type: gige
  frame_rate: 25.0

gige:
  fake: true
  camera_id: Fake_1
  pixel_format: BayerRG8
  timestamp_source: ptp_chunk     # fake camera has no chunks -> falls back to camera/system (expected)
  ptp_enable: false

recording:
  enabled: false

preview:
  enabled: false

transport:
  plugin_endpoint:
    enabled: true
    socket_path: /tmp/cam/frames   # JP7 / gst >= 1.24 -> unixfd at the sibling /tmp/cam/unixfd
  raw_endpoint:
    enabled: false        # no scenario reads it (shm-raw coverage lives in webrtc-fake.yaml)
    socket_path: /tmp/cam/raw
