name: ci
# Hardware-free correctness on both supported software runtimes, plus launcher contracts.
on:
  push:
    branches: [main, jp6-modern]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: tests (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: legacy
            target: distro
            base: ubuntu:22.04
            gstreamer: '1.20'
          - runtime: modern
            target: modern
            base: ubuntu:26.04
            gstreamer: '1.28.7'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build development runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: core-driver/Dockerfile.dev
          target: ${{ matrix.target }}
          build-args: BASE=${{ matrix.base }}
          tags: cam-ci:${{ matrix.runtime }}
          load: true
          cache-from: type=gha,scope=cam-ci-${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=cam-ci-${{ matrix.runtime }}
      - name: tests and branch coverage (no skips)
        env:
          CAM_DEV_IMAGE: cam-ci:${{ matrix.runtime }}
          CAM_EXPECT_GST: ${{ matrix.gstreamer }}
        run: bash tools/ci_test.sh
      - name: service smoke tests
        env:
          CAM_DEV_IMAGE: cam-ci:${{ matrix.runtime }}
        run: |
          set -o pipefail
          for suite in replay usb pcap lifecycle rtsp rtsp_reconnect; do
            timeout 180 bash "core-driver/tools/${suite}_test.sh" 2>&1 | tee "test-results/${suite}-smoke.log"
          done
      - name: coverage summary
        if: always()
        run: |
          if [ -f test-results/coverage.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/coverage.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: retain test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.runtime }}
          path: test-results/
          retention-days: 14

  dev-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: platform defaults and build commands
        run: python3 tools/test_dev_defaults.py

  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: christomaszewski/rig
          path: .rig
      - run: python3 -m pip install --user pyyaml
      # Certify against both real sensor shapes (usb exercises the device overlay, rtsp the probe-less
      # path). Warnings don't fail the job; contract errors do.
      - name: certify (usb config)
        run: ./.rig/rig certify --repo . --config core-driver/config/sensors/cam_usb.yaml
      - name: certify (rtsp config)
        run: ./.rig/rig certify --repo . --config core-driver/config/sensors/cam_rtsp.yaml
