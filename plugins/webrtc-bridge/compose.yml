# webrtc-bridge — heavy plugin, runs as its own container (gst-plugins-rs webrtcsink, built
# from source). Pulled into the per-sensor stack via the top-level `include:`, activated only
# when the `webrtc-bridge` profile is enabled. Transport mirrors the ros2 bridge (the core's
# plugin endpoint: unixfd on JP7, shm+36-byte-header on JP6 — so geometry self-describes and the
# capture timestamp survives for latency metrics); port comes from the sensor config (host
# networking -> a distinct port per sensor).
services:
  webrtc-bridge:
    profiles: ["webrtc-bridge"]
    image: ${CAM_WEBRTC_IMAGE:-${RIG_IMAGE_REGISTRY:+${RIG_IMAGE_REGISTRY}/}webrtc-bridge:${RIG_IMAGE_TAG:-latest}}  # rig: RIG_IMAGE_REGISTRY + RIG_IMAGE_TAG; standalone: cam-up sets CAM_WEBRTC_IMAGE from CAM_REGISTRY
    build:
      context: ../..
      dockerfile: plugins/webrtc-bridge/Dockerfile
    init: true
    network_mode: ${CAM_NETWORK:-host}     # host = expose signalling + WebRTC media to viewers
    ipc: host                               # share /dev/shm with the core (JP6 raw endpoint; harmless for unixfd)
    # JP6 (the base compose IS the JP6 shape, like the core): the nvidia runtime CSV-mounts the host's
    # BSP GStreamer plugins (nvv4l2h264enc & co) into the container, which is what gives the RANK env
    # below something to rank. This image isn't l4t-based, so the injection trigger env
    # (NVIDIA_VISIBLE_DEVICES, set in-image by l4t bases) is set explicitly under environment.
    # UNVALIDATED on JP6 hardware: r36 CSV ships gst-1.20/22.04-built plugins into this 24.04/gst-1.24
    # container (plugin ABI is forward-compatible and the .so deps ride along in the CSV) -- verify on
    # the vehicle with:  docker compose ... run --rm webrtc-bridge gst-inspect-1.0 nvv4l2h264enc
    # Worst case the plugin blacklists at registry scan and webrtcsink falls back to x264enc.
    # Overridden to runc by --dev (no nvidia runtime) and by the jp7 overlay (CDI device instead).
    runtime: nvidia
    volumes:
      - cam_sock:/tmp/cam
    environment:
      # Transport selection (mirrors the ros2 bridge; must match the core). Both platform defaults
      # ride the core's PLUGIN endpoint (transport.plugin_endpoint.enabled): unixfd on JP7
      # (/tmp/cam/unixfd -- unixfdsink broadcasts, shared with the ros2 bridge), headered shm on JP6
      # (/tmp/cam/frames -- [36-byte CAMF header][pixels]; the launcher's pump strips the header, so
      # geometry/format self-describe and the capture timestamp survives -> latency metrics).
      # CAM_TRANSPORT=shm-raw is the legacy raw endpoint (/tmp/cam/raw, needs
      # transport.raw_endpoint.enabled; env geometry, no capture timestamps). cam-up exports
      # CAM_PLATFORM; CAM_TRANSPORT ({unixfd|shm|shm-raw}) overrides. CAM_TRANSPORT_SOCKET empty ->
      # run.sh picks the per-transport default above (mirror of the ros2 bridge's launch default).
      - CAM_PLATFORM=${CAM_PLATFORM:-jp6}
      - CAM_TRANSPORT=${CAM_TRANSPORT:-}
      - CAM_TRANSPORT_SOCKET=${CAM_TRANSPORT_SOCKET:-}
      - CAM_SHM_SOCKET=${CAM_SHM_SOCKET:-/tmp/cam/raw}
      # Bayer color: sensor_env derives the pattern from the camera pixel_format; '' = mono. On the
      # self-describing transports the stream caps decide the front-end at runtime (bridge_stream.py
      # fmt_tap seam), so a config/device mismatch can't wedge the bridge -- on JP6 headered shm the
      # mosaic rides as GRAY8 and a non-empty CAM_BAYER relabels it video/x-bayer for bayer2rgb
      # (byte-identical; a wrong pattern only mis-tints). On shm-raw CAM_BAYER statically labels +
      # debayers. CAM_WEBRTC_DEBAYER=false forces the raw mosaic on every path.
      - CAM_BAYER=${CAM_BAYER:-}
      - CAM_WEBRTC_DEBAYER=${CAM_WEBRTC_DEBAYER:-auto}
      # 16-bit (thermal) operator preview: percentile-stretch GRAY16 -> GRAY8 in the bridge BEFORE the
      # 8-bit convert (`auto` or `lo:hi` percentiles). PREVIEW-ONLY -- recording/ROS keep raw 16-bit.
      # off (default) = plain videoconvert, which keeps only the top byte (near-black for LSB-aligned
      # radiometric cameras).
      - CAM_WEBRTC_NORMALIZE=${CAM_WEBRTC_NORMALIZE:-off}
      # Encode-side downscale: bound the geometry fed to the encoder -- `WxH` (a box) or `N` (both
      # axes); aspect kept, even dims, never upscaled. videoconvert + the (software) encoder then
      # run at the reduced size: THE CPU lever for a 5MP color preview. Planned at runtime from the
      # stream's own caps, so it needs no geometry env. PREVIEW-ONLY -- recording/ROS keep full res.
      - CAM_WEBRTC_MAX_SIZE=${CAM_WEBRTC_MAX_SIZE:-}
      # Ingress throttle: with no viewer connected the debayer/convert/scale chain runs for nobody
      # (NVENC only made the encoder cheap) -- run it at a 1 fps trickle until a viewer connects
      # (a trickle, not a stop: codec discovery and a late-counted viewer stay alive; 0 = off). Plus
      # an optional preview rate cap, dropped at ingress too: the plugin endpoint's rate is shared
      # with the ROS bridge, so this is how the preview runs slower than it.
      - CAM_WEBRTC_IDLE_FPS=${CAM_WEBRTC_IDLE_FPS:-}
      - CAM_WEBRTC_IDLE_GRACE_S=${CAM_WEBRTC_IDLE_GRACE_S:-}
      - CAM_WEBRTC_MAX_FPS=${CAM_WEBRTC_MAX_FPS:-}
      # Geometry: only the LEGACY shm-raw path needs it (raw shm carries no caps; must match the
      # camera frame). The plugin-endpoint transports self-describe -- CAM_FPS alone still serves as
      # the caps rate HINT on headered shm (the header carries no rate; feeds the H.264 level math).
      - CAM_WIDTH=${CAM_WIDTH:-512}
      - CAM_HEIGHT=${CAM_HEIGHT:-512}
      - CAM_FORMAT=${CAM_FORMAT:-GRAY8}
      - CAM_FPS=${CAM_FPS:-25}
      - SIGNALLING_PORT=${CAM_SIGNALLING_PORT:-8443}
      # Fleet discovery (docs/DISCOVERY.md): once streaming, the bridge advertises this stream over
      # Zenoh at fleet/<VEHICLE_ID>/media/<CAM_INSTANCE> -- a liveliness token (presence) + a queryable
      # (JSON descriptor). Best-effort + additive: CAM_ADVERTISE=0 (or CAM_LAUNCHER=gst-launch) turns
      # it off and the video path is untouched. VEHICLE_ID empty -> the container hostname.
      - CAM_INSTANCE=${CAM_INSTANCE:-camera}
      - VEHICLE_ID=${VEHICLE_ID:-}
      - ZENOH_CONNECT=${ZENOH_CONNECT:-tcp/localhost:7447}   # the vehicle's local zenohd; set empty to scout
      - CAM_ADVERTISE=${CAM_ADVERTISE:-1}
      - CAM_LAUNCHER=${CAM_LAUNCHER:-}
      - CAM_PRODUCER_ID=${CAM_PRODUCER_ID:-}              # default <vehicle>-<sensor>; == webrtcsink meta.name
      - CAM_STREAM_ROLE=${CAM_STREAM_ROLE:-}              # human label; default = sensor id
      - CAM_SIGNALLING_URL=${CAM_SIGNALLING_URL:-}        # full override; else <scheme>://<host>:<port>
      - CAM_SIGNALLING_HOST=${CAM_SIGNALLING_HOST:-}      # default = hostname (reachability is deployment's job)
      - CAM_SIGNALLING_SCHEME=${CAM_SIGNALLING_SCHEME:-ws}
      - CAM_SIGNALLING_PROTOCOL=${CAM_SIGNALLING_PROTOCOL:-gstwebrtc-api}
      - CAM_ROS_TOPIC=${CAM_ROS_TOPIC:-}                  # OPTIONAL linkage if a ros bridge coexists
      - CAM_RECORDING_GLOB=${CAM_RECORDING_GLOB:-}        # OPTIONAL recording linkage
      - VIDEO_CAPS=${VIDEO_CAPS:-}                          # pin a codec (e.g. video/x-h264) -> descriptor hint
      # JP6 CSV-injection triggers (l4t base images carry these in-image; this ubuntu base doesn't).
      # Inert under --dev/runc and on JP7 (CDI grants by device, not env).
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Force the Jetson HW encoder: webrtcsink picks the highest-RANKED encoder for the negotiated codec,
      # which by default is the CPU x264enc. Bump nvv4l2h264enc so NVENC is used (pair with VIDEO_CAPS=
      # video/x-h264). The element exists in this container only via the platform grant (CDI device on
      # JP7 -- docker-compose.jp7.yml; nvidia-runtime CSV mounts on JP6 -- above); webrtcsink inserts the
      # nvvidconv->NVMM hop itself. A plain GStreamer env var read at registry load; a no-op if the
      # element is absent (--dev, or Orin Nano which has no H.264 NVENC -> falls back to x264enc).
      # Comma-list for multiple, e.g. nvv4l2h264enc:MAX,nvv4l2h265enc:MAX.
      - GST_PLUGIN_FEATURE_RANK=${GST_PLUGIN_FEATURE_RANK:-}
      # H.264 encode (webrtcsink re-encodes from raw): the LEVEL is AUTO-derived from the resolution+fps
      # fed to webrtcsink so the SDP profile-level-id matches the stream (a fixed level = an out-of-level
      # black tile in the browser on high-res streams). The PROFILE is effectively FIXED at
      # constrained-baseline: webrtcsink pins it on its parser filter for raw input at codec discovery
      # (parser_caps force_profile -- unchanged through gst-plugins-rs 0.15), so `high` cannot take
      # effect on ANY encoder; the launcher warns + falls back. Knob kept for when upstream honors it.
      - CAM_WEBRTC_PROFILE=${CAM_WEBRTC_PROFILE:-}          # constrained-baseline (default; `high` warns + falls back)
      - CAM_WEBRTC_MAX_LEVEL=${CAM_WEBRTC_MAX_LEVEL:-}      # safety clamp on the auto level (e.g. 4.2); default 5.2
      # Adaptive bitrate: webrtcsink runs Google Congestion Control (gcc) and scales the encoder bitrate
      # to each viewer's link automatically. These OPTIONAL bounds (bit/sec) frame that range; the element
      # default max is 8 Mbps, which caps quality at high res -> set CAM_WEBRTC_MAX_BITRATE (e.g. 20000000)
      # for 4K. CAM_WEBRTC_CONGESTION = gcc|homegrown|disabled (default gcc).
      - CAM_WEBRTC_MIN_BITRATE=${CAM_WEBRTC_MIN_BITRATE:-}
      - CAM_WEBRTC_MAX_BITRATE=${CAM_WEBRTC_MAX_BITRATE:-}
      - CAM_WEBRTC_START_BITRATE=${CAM_WEBRTC_START_BITRATE:-}
      - CAM_WEBRTC_CONGESTION=${CAM_WEBRTC_CONGESTION:-}
      # Diagnostics: the bridge logs a startup element inventory (is NVENC actually present /
      # ranked?) and a status heartbeat -- pipeline state, frames received from the core, negotiated
      # caps, connected viewers, and (plugin-endpoint transports) per-interval capture->ingress /
      # capture->encoder-input latency percentiles -- every CAM_WEBRTC_STATUS seconds (default 10;
      # 0 = off). CAM_WEBRTC_LATENCY_OVERLAY=true burns the live capture->encode latency into the
      # video itself (textoverlay; any viewer sees it, zero client support; "lat --" on shm-raw
      # where no capture timestamp survives). GST_DEBUG is the standard GStreamer debug spec for
      # deep dives (e.g. "3,webrtcsink:6"). All settable from the sensor YAML's webrtc-bridge
      # params (UPPERCASE passthrough).
      - CAM_WEBRTC_STATUS=${CAM_WEBRTC_STATUS:-}
      - CAM_WEBRTC_LATENCY_OVERLAY=${CAM_WEBRTC_LATENCY_OVERLAY:-}
      - CAM_WEBRTC_STATUS_THREADS=${CAM_WEBRTC_STATUS_THREADS:-}   # N busiest threads on the heartbeat (per-element CPU)
      - GST_DEBUG=${GST_DEBUG:-}
      - GST_DEBUG_NO_COLOR=1
    command: ["bash", "run.sh"]
    depends_on:
      - core-driver
    restart: unless-stopped

volumes:
  cam_sock:
    external: true
    name: ${CAM_SOCK_VOLUME:-cam_sock}
