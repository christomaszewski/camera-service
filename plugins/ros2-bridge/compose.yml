# ros2-bridge — heavy plugin, runs as its own container (ROS2/DDS on a Lyrical Luth LTS base).
# Pulled into the per-sensor stack by the top-level docker-compose.yml via `include:`, and
# activated only when the `ros2-bridge` profile is enabled (cam-up derives the profile set
# from the sensor config's enabled `isolation: container` plugins).
#
# Note: with `include`, relative paths here resolve relative to THIS file's directory, so the
# build context climbs to the repo root (../..).
services:
  ros2-bridge:
    profiles: ["ros2-bridge"]
    image: ${CAM_ROS2_IMAGE:-${RIG_IMAGE_REGISTRY:+${RIG_IMAGE_REGISTRY}/}ros2-bridge:${RIG_IMAGE_TAG:-latest}}  # rig: RIG_IMAGE_REGISTRY + RIG_IMAGE_TAG; standalone: cam-up sets CAM_ROS2_IMAGE from CAM_REGISTRY
    build:
      context: ../..
      dockerfile: plugins/ros2-bridge/Dockerfile
    init: true
    # PID 1 here is `ros2 launch`, which does NOT act on SIGTERM -- measured: the container is still
    # running 20s after SIGTERM and Docker then SIGKILLs it, so EVERY `compose down` hard-killed the
    # bridge and no destructor (hence no clean GStreamer teardown, no component shutdown) ever ran.
    # On SIGINT the same container exits 0 in ~1s. Verified identically against pre-change main, so
    # this is long-standing, not new -- but it is what makes the teardown ordering in
    # CamBridgeBase::stop_pipeline actually reachable on a normal stop.
    stop_signal: SIGINT
    network_mode: ${CAM_NETWORK:-host}     # host = join the host ROS2 graph
    ipc: host                               # share /dev/shm with the core (JP6 shm transport; harmless for unixfd)
    # Sized in lockstep with the zenoh SHM pool: sensor_env derives CAM_ROS2_SHM_SIZE (= pool + 64 MiB
    # headroom) from the ros2-bridge `zenoh_shm_pool_size` param. NOTE: docker IGNORES shm_size while
    # ipc is host (the host's /dev/shm applies; cam-up warns when that is too small for the pool) --
    # this keeps any non-host-IPC variant of the stack from capping zenoh SHM at docker's 64 MiB default.
    shm_size: ${CAM_ROS2_SHM_SIZE:-64m}
    volumes:
      - cam_sock:/tmp/cam
    environment:
      # Transport selection (must match the core): unixfd on JP7, shm+header on JP6. cam-up exports the
      # host platform; the launch file derives the component + socket from it (CAM_TRANSPORT overrides).
      - CAM_PLATFORM=${CAM_PLATFORM:-jp6}
      - CAM_TRANSPORT=${CAM_TRANSPORT:-}
      # Per-sensor identity (sensor_env derives these from the config): ROS namespace, topic, frame_id.
      - CAM_INSTANCE=${CAM_INSTANCE:-camera}
      - CAM_ROS_TOPIC=${CAM_ROS_TOPIC:-image_raw}
      - CAM_FRAME_ID=${CAM_FRAME_ID:-camera}
      # Bayer color: sensor_env derives these from the camera pixel_format + the plugin's `debayer` param.
      # CAM_ROS_ENCODING labels a mosaic stream (e.g. bayer_rggb8); '' = mono. CAM_DEBAYER=true turns on
      # debayering -- JP7 in the GStreamer pipeline (bayer2rgb), JP6 via a composed image_proc::DebayerNode.
      - CAM_ROS_ENCODING=${CAM_ROS_ENCODING:-}
      - CAM_DEBAYER=${CAM_DEBAYER:-false}
      # Join the vehicle-wide ROS 2 graph. `rig` exports these before calling cam-up so every stack
      # shares one graph; the defaults are also correct standalone. The graph runs on rmw_zenoh_cpp,
      # which discovers via a shared host `rmw_zenohd` router (rig runs it; standalone: `cam-up
      # --zenohd` or tools/zenohd.sh). On host networking the node reaches it at the default
      # tcp/localhost:7447 -- no extra config. FastDDS stays selectable via RMW_IMPLEMENTATION.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      # Optional: point the zenoh session at a non-localhost router (rig sets this for a remote hub).
      # NOTE: a config URI REPLACES the whole rmw_zenoh default session config; for tuning a few keys
      # use the override knobs below instead, which layer on top of the defaults.
      - ZENOH_SESSION_CONFIG_URI=${ZENOH_SESSION_CONFIG_URI:-}
      # Large-image tuning (rmw_zenoh). The friendly CAM_ZENOH_* knobs are folded by the launch file
      # into ZENOH_CONFIG_OVERRIDE (`path=value;...`, applied ON TOP of the defaults). Set them from
      # the sensor YAML (ros2-bridge params zenoh_shm / zenoh_shm_pool_size / zenoh_shm_msg_threshold
      # -- sensor_env maps them) or export directly. ZENOH_CONFIG_OVERRIDE itself stays available as
      # the raw escape hatch for any other zenoh key (appended last -> wins on conflicts).
      - CAM_ZENOH_SHM=${CAM_ZENOH_SHM:-}                             # true/false: zenoh shared-memory transport
      - CAM_ZENOH_SHM_POOL_SIZE=${CAM_ZENOH_SHM_POOL_SIZE:-}         # SHM segment bytes (default 48 MiB)
      - CAM_ZENOH_SHM_MSG_THRESHOLD=${CAM_ZENOH_SHM_MSG_THRESHOLD:-} # min bytes routed via SHM (default 512)
      - ZENOH_CONFIG_OVERRIDE=${ZENOH_CONFIG_OVERRIDE:-}
      # rmw_zenoh serialization buffer pool cap (bytes, default 8 MiB) -- raise it so multi-MB Image
      # messages recycle pooled buffers instead of hitting the allocator every publish.
      - RMW_ZENOH_BUFFER_POOL_MAX_SIZE_BYTES=${RMW_ZENOH_BUFFER_POOL_MAX_SIZE_BYTES:-}
      # Optional outbound throttle (Hz): cap the bridge's publish rate by dropping frames (the core
      # keeps its native rate for recording/preview). Empty/0 = publish every frame.
      - CAM_ROS_PUBLISH_RATE=${CAM_ROS_PUBLISH_RATE:-}
    # Compose the container per platform (env-driven). The launch file picks CamUnixfdBridge (JP7) or
    # CamHeaderBridge (JP6), namespaces it /<instance>, and on JP6+debayer also loads image_proc.
    command: ["ros2", "launch", "cam_ros2_bridge", "bridge.launch.py"]
    depends_on:
      - core-driver
    restart: unless-stopped

volumes:
  cam_sock:
    external: true
    name: ${CAM_SOCK_VOLUME:-cam_sock}
